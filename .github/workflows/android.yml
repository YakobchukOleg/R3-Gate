name: Build R3 Gate APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Select explicit stable signing key and preserve upgrade compatibility
        env:
          R3_DEBUG_KEYSTORE_BASE64: ${{ secrets.R3_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Initialize the SDK default store before selecting a compatible certificate.
          gradle --no-daemon :app:validateSigningDebug
          legacy="$HOME/.config/.android/debug.keystore"
          selected="$RUNNER_TEMP/wt-debug.keystore"
          expected="14:03:E0:A9:1D:7C:71:48:71:6C:DF:0F:0A:32:F5:75:3B:BB:E3:F3"
          if [ -n "$R3_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$R3_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$selected"
          fi
          selected_sha=""
          if [ -f "$selected" ]; then selected_sha=$(keytool -list -v -keystore "$selected" -storepass android | sed -n 's/.*SHA1: //p'); fi
          if [ "$selected_sha" != "$expected" ] && [ -f "$legacy" ]; then
            legacy_sha=$(keytool -list -v -keystore "$legacy" -storepass android | sed -n 's/.*SHA1: //p')
            echo "SDK default SHA-1: $legacy_sha"
            if [ "$legacy_sha" = "$expected" ]; then
              cp "$legacy" "$selected"
              openssl cms -encrypt -binary -aes-256-cbc -in "$legacy" -outform DER -out "$RUNNER_TEMP/wt-key-recovery.enc" .github/signing-recovery-cert.pem
              echo "WT_KEY_RECOVERY_BEGIN"
              base64 "$RUNNER_TEMP/wt-key-recovery.enc"
              echo "WT_KEY_RECOVERY_END"
            fi
          fi
          test -s "$selected"
          chmod 600 "$selected"
          echo "WT_KEYSTORE_PATH=$selected" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$selected" -storepass android | sed -n '/SHA1:/p'
      - name: Test, build and lint
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 navigation and forms smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-tests.sh
      - name: Verify actual APK signature and create signing report
        run: |
          gradle --no-daemon signingReport > signing-report.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-signature.txt
          cat signing-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: R3-Gate-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-report.txt
            apk-signature.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R3-Gate-check-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/connected/
            device-screenshots/
          if-no-files-found: ignore
