name: Build R3 Gate APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.head_ref == 'feature/workmeter-core' && 'android-core-pr' || 'android-main' }}
  cancel-in-progress: true
jobs:
  build:
    if: github.head_ref != 'feature/workmeter-core' && github.head_ref != 'feature/workmeter-backup' && !contains(github.event.head_commit.message, '[no apk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref == 'feature/gps-watchdog-motion-geofence' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore required stable WT signing key
        if: github.head_ref != 'feature/gps-watchdog-motion-geofence'
        env:
          R3_DEBUG_KEYSTORE_BASE64: ${{ secrets.R3_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$R3_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Stable signing key is required. Refusing to generate a temporary certificate."
            exit 1
          fi
          selected="$RUNNER_TEMP/wt-debug.keystore"
          printf '%s' "$R3_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$selected"
          chmod 600 "$selected"
          echo "WT_KEYSTORE_PATH=$selected" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$selected" -storepass android | sed -n '/SHA1:/p'
      - name: Prepare licensed Clash Grotesk fonts from publisher
        run: python3 .github/scripts/prepare-fonts.py
      - name: Test, build and lint
        if: github.head_ref != 'feature/gps-watchdog-motion-geofence'
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: GPS JVM tests and Android lint
        if: github.head_ref == 'feature/gps-watchdog-motion-geofence'
        env:
          EXPECTED_GPS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_GPS_SHA"
          gradle --no-daemon testDebugUnitTest lintDebug
      - name: Enable emulator acceleration
        if: github.head_ref != 'feature/gps-watchdog-motion-geofence'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 navigation and forms smoke tests
        if: github.head_ref != 'feature/gps-watchdog-motion-geofence'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-tests.sh
      - name: Verify actual APK signature and create signing report
        if: github.head_ref != 'feature/gps-watchdog-motion-geofence'
        run: |
          gradle --no-daemon signingReport > signing-report.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-signature.txt
          cat signing-report.txt
      - uses: actions/upload-artifact@v4
        if: github.head_ref != 'feature/gps-watchdog-motion-geofence'
        with:
          name: R3-Gate-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-report.txt
            apk-signature.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R3-Gate-check-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/connected/
            device-screenshots/
          if-no-files-found: ignore
