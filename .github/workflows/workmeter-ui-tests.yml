name: WorkMeter UI tests

on:
  push:
    branches:
      - feature/workmeter-ui
      - integration/workmeter-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workmeter-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-unit-tests:
    name: Compile and run Android JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Clash Grotesk assets
        run: python3 .github/scripts/prepare-fonts.py
      - name: Compile and test Android UI module
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workmeter-ui-junit-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  ui-device-tests:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'integration/workmeter-ui'
    name: Android instrumentation suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Clash Grotesk assets
        run: python3 .github/scripts/prepare-fonts.py
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/device-tests.sh
      - name: Publish device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workmeter-ui-device-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
