name: WorkMeter UI unit tests

on:
  push:
    branches:
      - feature/workmeter-ui
    paths:
      - 'app/src/main/java/com/r3gate/app/**'
      - 'app/src/test/java/com/r3gate/app/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/scripts/prepare-fonts.py'
      - '.github/workflows/workmeter-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workmeter-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-unit-tests:
    name: Compile and run Android JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Clash Grotesk assets
        run: python3 .github/scripts/prepare-fonts.py
      - name: Compile and test Android UI module
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workmeter-ui-junit-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
