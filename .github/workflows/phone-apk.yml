name: WorkMeter SOLO phone APK
on:
  push:
    branches: [build/workmeter-solo-2.3.2]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore required stable WT signing key
        env:
          R3_DEBUG_KEYSTORE_BASE64: ${{ secrets.R3_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$R3_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Stable signing key is required. Refusing to generate a temporary certificate."
            exit 1
          fi
          selected="$RUNNER_TEMP/wt-debug.keystore"
          printf '%s' "$R3_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$selected"
          chmod 600 "$selected"
          echo "WT_KEYSTORE_PATH=$selected" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$selected" -storepass android | sed -n '/SHA1:/p'
      - name: Prepare licensed Clash Grotesk fonts from publisher
        run: python3 .github/scripts/prepare-fonts.py
      - name: Build signed APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK and package metadata
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | sed -n '/^package:/p; /^sdkVersion:/p; /^targetSdkVersion:/p'
          cp "$apk" WorkMeter-SOLO-2.3.2.apk
          sha256sum WorkMeter-SOLO-2.3.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WorkMeter-SOLO-2.3.2
          path: WorkMeter-SOLO-2.3.2.apk
          if-no-files-found: error
